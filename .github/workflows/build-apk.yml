name: Build and Test Android APK
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Check JavaScript syntax
        run: |
          node --check app/src/main/assets/app.js
          node --check app/src/main/assets/enhancements.js
          node --check app/src/main/assets/v12.js
          node --check app/src/main/assets/v13.js
          node --check app/src/main/assets/v14.js
      - name: Build app and test APKs
        run: gradle assembleDebug assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: EldarFit-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  emulator-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run online and offline emulator tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            gradle assembleDebug assembleDebugAndroidTest
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            echo "=== ONLINE FUNCTION + USDA TESTS ==="
            set -o pipefail
            adb shell am instrument -w -e class com.eldarfit.app.OnlineAppTest com.eldarfit.app.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/online-tests.log
            grep -q "OK (5 tests)" /tmp/online-tests.log
            ! grep -q "FAILURES!!!" /tmp/online-tests.log
            echo "=== DISABLE NETWORK ==="
            adb shell cmd connectivity airplane-mode enable || true
            adb shell svc wifi disable || true
            adb shell svc data disable || true
            sleep 3
            adb shell am force-stop com.eldarfit.app
            echo "=== OFFLINE FUNCTION TESTS ==="
            adb shell am instrument -w -e class com.eldarfit.app.OfflineAppTest com.eldarfit.app.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/offline-tests.log
            grep -q "OK (1 test)" /tmp/offline-tests.log
            ! grep -q "FAILURES!!!" /tmp/offline-tests.log
